name: Issue report
description: Report a problem with a YAOPL build
title: "[ISSUE]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ### __Disclaimer:__
        This is the issue tracker of YAOPL, a fork of Open PS2 Loader. Only builds from this repository's
        [`latest` pre-release](https://github.com/yaopl/yaopl/releases/tag/latest) are accepted; their version ends in `-yaopl`.
        For official OPL builds, report to [Open PS2 Loader](https://github.com/ps2homebrew/Open-PS2-Loader/issues) instead.
        Issue reports for 3rd party HDD adapters (like Gamestar) are not accepted.
        Issue reports for consoles with installed and enabled modchip are not accepted.
        Before posting the issue confirm that you meet the below requirements.

  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      description: "Check before posting"
      options:
        - label: I have checked existing [__YAOPL issues__](https://github.com/yaopl/yaopl/issues?q=is%3Aissue) for duplicates and found none
          required: true
        - label: I am using the [latest YAOPL build](https://github.com/yaopl/yaopl/releases/tag/latest).
          required: true

  - type: textarea
    id: explanation
    attributes:
      label: Describe the issue
      description: A clear and concise description of what the issue is, and the steps that lead to it.
      placeholder: My issue is...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Configuration
        > (please complete the following information):

  - type: input
    id: console
    attributes:
      label: Console model
      description: You can see it on the console sticker or inside OSDSYS (press triangle on main menu)
      placeholder: SCPH-?????
    validations:
      required: true

  - type: input
    id: oplver
    attributes:
      label: "YAOPL version"
      description: "Open YAOPL, press START and look for the About option; the version number will be at the top."
      placeholder: "e.g. v1.2.0-Beta-2310-1a2b3c4-yaopl (Note: 'Latest Version' is not a valid answer)"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: "In which device(s) have you experienced this issue?"
      multiple: true
      options:
        - Neither
        - USB
        - SMB
        - HDD
        - iLink
        - MX4SIO
        - UDPBD
        - MMCE
    validations:
      required: true

  - type: dropdown
    id: extra-features
    attributes:
      label: "Which extra features are enabled?"
      multiple: true
      options:
        - Neither
        - VMC
        - PADEMU
        - GSM
        - Cheats
    validations:
      required: true

  - type: input
    id: compat-modes
    attributes:
      label: Compatibility modes
      description: Which compatibility modes were tested?
      placeholder: "e.g. mode 6, 6+3, 1+3+6..."
    validations:
      required: true

  - type: textarea
    id: context-and-data
    attributes:
      label: Context and extra information
      description: Information about affected games (Game name, [Game ID], link to redump.org) and expected behavior
      placeholder: "game affected is Kingdom Hearts: II Final Mix [SLPM_666.75], http://redump.org/disc/7733/"
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: "Does official OPL have the same issue?"
      description: "Testing the same game with an official [OPL release](https://github.com/ps2homebrew/Open-PS2-Loader/releases) helps tell YAOPL's bugs from upstream's."
      options:
        - Not tested
        - "Yes, official OPL has it too"
        - "No, only YAOPL has it"
    validations:
      required: true
