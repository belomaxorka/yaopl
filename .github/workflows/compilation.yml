name: CI-compile

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      make_args:
        description: 'Extra arguments for the main build, e.g. MMCE_NO_SDK_SIO2MAN=1 (the A/B build for MMCE)'
        required: false
        default: ''
  repository_dispatch:
    types: [run_build]

# The toolchain image (ps2sdk, gsKit, ps2sdk-ports) is pinned by digest, so a build does not change
# when ps2sdk does; sdk-canary.yml builds against the newest image. Every "container:" below must name
# this digest (checked in the build job). TOOLCHAIN_PS2SDK is the ps2sdk commit inside the image.
env:
  TOOLCHAIN_IMAGE: ghcr.io/ps2homebrew/ps2homebrew@sha256:f92b526029a743bc30fb47d0af096f67d7e4e97e4019313f65508f6f6cdaaa91
  TOOLCHAIN_PS2SDK: 329e2bb43287e16af16c4dde1c614e2662c24468

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:f92b526029a743bc30fb47d0af096f67d7e4e97e4019313f65508f6f6cdaaa91
    steps:
    - name: git checkout
      uses: actions/checkout@v4

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Check that every job uses the pinned toolchain image
      run: |
        wf=.github/workflows/compilation.yml
        bad=$(grep -E '^ +(container|container_commit): ' $wf | grep -v -e "${TOOLCHAIN_IMAGE#*@}" -e 'matrix.container_commit' || true)
        if [ -n "$bad" ]; then
          echo "::error::$wf: every container must be $TOOLCHAIN_IMAGE, not: $bad"
          exit 1
        fi

    - name: Compile -> make clean release
      run: make --trace clean release ${{ inputs.make_args }}

    - name: Report the toolchain and the embedded ps2sdk modules
      run: |
        echo "toolchain image: $TOOLCHAIN_IMAGE"
        echo "ps2sdk: $TOOLCHAIN_PS2SDK"
        cd "$PS2SDK/iop/irx" && sha256sum $(grep -o 'iop/irx/[A-Za-z0-9_-]*\.irx' "$GITHUB_WORKSPACE/Makefile" | sed 's|^iop/irx/||' | sort -u)

    - name: Report the embedded USBD (built from pre-rewrite ps2sdk sources, see FORK.md)
      run: |
        ls -l modules/usb/usbd_mini/usbd_mini.irx "$PS2SDK/iop/irx/usbd_mini.irx"
        sha256sum modules/usb/usbd_mini/usbd_mini.irx "$PS2SDK/iop/irx/usbd_mini.irx"
        git -C modules/usb/usbd_mini/ps2sdk log -1 --format='ps2sdk USBD sources: %H (%cs)'

    - name: Report the MMCE modules (built from ps2-mmce/mmceman, see FORK.md)
      run: |
        ls -l modules/mmce/mmceman/mmceman/irx/mmceman.irx modules/mmce/mmceman/mmcedrv/irx/mmcedrv.irx modules/mmce/mmceman/mmceigr/irx/mmceigr.irx
        sha256sum modules/mmce/mmceman/mmceman/irx/mmceman.irx modules/mmce/mmceman/mmcedrv/irx/mmcedrv.irx modules/mmce/mmceman/mmceigr/irx/mmceigr.irx
        git -C modules/mmce/mmceman log -1 --format='mmceman sources: %H (%cs)'

    - name: Create detailed changelog
      run: sh ./make_changelog.sh

    - name: Upload release artifact ELF
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: OPNPS2LD
        path: |
          OPNPS2LD-*.ELF

    - name: Upload release artifact info
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: INFO
        path: |
          DETAILED_CHANGELOG
          CREDITS
          LICENSE
          README.md

  build-variants:
    strategy:
      fail-fast: false
      matrix:
        extra: [EXTRA_FEATURES=0, EXTRA_FEATURES=1]
        pademu: [PADEMU=0, PADEMU=1]
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:f92b526029a743bc30fb47d0af096f67d7e4e97e4019313f65508f6f6cdaaa91
    steps:
    - name: git checkout
      uses: actions/checkout@v4

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    - name: Compile -> make ${{ matrix.extra }} ${{ matrix.pademu }} ${{ matrix.extra }} NOT_PACKED=1
      run: |
        make --trace ${{ matrix.pademu }} ${{ matrix.extra }} NOT_PACKED=1
        mv opl.elf OPNPS2LD-${{ env.OPL_VERSION }}-${{ matrix.pademu }}-${{ matrix.extra }}.ELF

    - name: Create detailed changelog
      run: sh ./make_changelog.sh

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v4
      with:
        name: OPNPS2LD-VARIANTS ${{ matrix.pademu }} ${{ matrix.extra }}
        path: OPNPS2LD*.ELF

  merge-variants:
    runs-on: ubuntu-latest
    needs: build-variants
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: OPNPS2LD-VARIANTS
          pattern: OPNPS2LD-VARIANTS*
          delete-merged: true

  build-lang:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:f92b526029a743bc30fb47d0af096f67d7e4e97e4019313f65508f6f6cdaaa91
    steps:
    - name: git checkout
      uses: actions/checkout@v4

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Compile -> make download_lng languages
      run: make --trace download_lng languages

    - name: Create artifact
      run: sh ./lng_pack.sh

    - name: Upload release artifact
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: OPNPS2LD-LANGS
        path: |
          OPNPS2LD-LANGS-*.zip

  build-debug:
    strategy:
      fail-fast: false
      matrix:
        debug: [iopcore_debug, ingame_debug, eesio_debug, iopcore_ppctty_debug, ingame_ppctty_debug, DTL_T10000=1]
        # container_commit: [":main", "@sha256:1f00689809455d43b520e4cd4eea00c6be56d71819ae38efc6b55b56464cbd1e"] Replace with desired docker image hash or tag
        container_commit: ["@sha256:f92b526029a743bc30fb47d0af096f67d7e4e97e4019313f65508f6f6cdaaa91"]
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew${{ matrix.container_commit }}
    steps:
    - name: git checkout
      uses: actions/checkout@v4

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV
        SHORT_COMMIT="${{ matrix.container_commit }}"
        # Extract the last 4 characters
        SHORT_COMMIT=${SHORT_COMMIT: -4}
        echo "SHORT_COMMIT=$SHORT_COMMIT" >> $GITHUB_ENV

    - name: Compile -> make debug
      run: |
        make ${{ matrix.debug }} --trace
        mv opl.elf opl-${{ matrix.debug }}-${{ env.OPL_VERSION }}-${{ env.SHORT_COMMIT }}.elf

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v4
      with:
        name: opl-${{ matrix.debug }}-${{ env.OPL_VERSION }}-${{ env.SHORT_COMMIT }}
        path: opl-*.elf

  merge-debug:
    runs-on: ubuntu-latest
    needs: build-debug
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: OPNPS2LD-DEBUG
          pattern: opl-*
          delete-merged: true

  release:
    needs: [build, build-variants, build-lang]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    env:
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
    - name: git checkout
      uses: actions/checkout@v4

    - run: git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Prepare artifacts for release
      run: |
        echo packing release of OPL ${{ env.OPL_VERSION }}
        cp INFO/* OPNPS2LD/
        cp INFO/* OPNPS2LD-VARIANTS/
        7z a -t7z OPNPS2LD-${{ env.OPL_VERSION }}.7z OPNPS2LD/*
        7z a -t7z OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z OPNPS2LD-VARIANTS/*
        7z a -t7z OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z OPNPS2LD-LANGS/*
        cp -f OPNPS2LD-${{ env.OPL_VERSION }}.7z OPNPS2LD.7z
        cp -f OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z OPNPS2LD-VARIANTS.7z
        cp -f OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z OPNPS2LD-LANGS.7z
        cp -f OPNPS2LD/OPNPS2LD-${{ env.OPL_VERSION }}.ELF OPNPS2LD.ELF

    - name: Publish the fork's rolling pre-release
      if: github.repository != 'ps2homebrew/Open-PS2-Loader' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # A run that GitHub delays or retries may finish after a newer one: only the tip of master is published.
        tip=$(git ls-remote origin refs/heads/master | cut -f1)
        if [ "$tip" != "$GITHUB_SHA" ]; then
          echo "master is at $tip now, not publishing the build of $GITHUB_SHA"
          exit 0
        fi
        files="OPNPS2LD.ELF OPNPS2LD-${{ env.OPL_VERSION }}.7z OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z"
        sha256sum $files > SHA256SUMS
        cat SHA256SUMS
        gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
        git push --delete origin latest || true
        {
          echo "Automatic YAOPL (Yet Another Open PS2 Loader) build of ${{ env.OPL_VERSION }} from $GITHUB_SHA."
          echo
          echo "Not an official OPL build: see FORK.md for what differs from upstream OPL."
          echo "SHA-256 checksums of the files are in SHA256SUMS."
          echo
          echo "Built with ps2sdk $TOOLCHAIN_PS2SDK (toolchain image $TOOLCHAIN_IMAGE)."
        } > notes.md
        gh release create latest $files SHA256SUMS --repo "$GITHUB_REPOSITORY" --prerelease \
          --target "$GITHUB_SHA" --title "${{ env.OPL_VERSION }}" --notes-file notes.md

    - name: Create prerelease
      if: github.repository == 'ps2homebrew/Open-PS2-Loader' && github.ref == 'refs/heads/master'
      uses: mathieucarbou/marvinpinto-action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: true
        automatic_release_tag: "latest"
        title: "${{ steps.version.outputs.version }}"
        files: |
          OPNPS2LD-${{ env.OPL_VERSION }}.7z
          OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z
          OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z
          OPNPS2LD.7z
          OPNPS2LD-VARIANTS.7z
          OPNPS2LD-LANGS.7z
          OPNPS2LD.ELF

    - name: Create release
      if: github.repository == 'ps2homebrew/Open-PS2-Loader' && startsWith(github.ref, 'refs/tags/v')
      uses: mathieucarbou/marvinpinto-action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: "${{ contains(github.ref, '-rc') }}"
        title: "${{ env.OPL_VERSION }}"
        files: |
          OPNPS2LD-${{ env.OPL_VERSION }}.7z
          OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z
          OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z
          OPNPS2LD.7z
          OPNPS2LD-VARIANTS.7z
          OPNPS2LD-LANGS.7z
          OPNPS2LD.ELF

    - name: Upload pre-release to Mega
      if: github.ref == 'refs/heads/master' && env.USERNAME != null
      uses: Difegue/action-megacmd@master
      with:
        args: put -c OPNPS2LD.7z /OPL/Pre-Release/${{ env.OPL_VERSION }}/run_${{ github.run_number }}/

    - name: Upload release to Mega
      if: startsWith(github.ref, 'refs/tags/v') && env.USERNAME != null
      uses: Difegue/action-megacmd@master
      with:
        args: put -c OPNPS2LD.7z /OPL/Release/${{ env.OPL_VERSION }}/
